[project]
name = "orthosense-backend"
version = "0.1.0"
description = "OrthoSense Telerehabilitation Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "sqlmodel>=0.0.38",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.1",
    "aiofiles>=25.1.0",
    "pydantic-settings>=2.13.1",
    "structlog>=25.5.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.12.1",
    "pydantic[email]>=2.13.0",
    "python-multipart>=0.0.26",
    "greenlet>=3.4.0",
    "numpy>=2.4.4",
    "boto3>=1.42.88",
    "httpx>=0.28.1",
]

[project.optional-dependencies]

dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-benchmark>=5.2.3",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "greenlet>=3.4.0",
    "types-aiofiles>=25.1.0.20260409",
]

ai-full = [
    "torch>=2.11.0",
    "mediapipe>=0.10.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (standard FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["app"]
relative_files = true
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
