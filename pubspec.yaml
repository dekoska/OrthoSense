name: orthosense
description: Digital Health telerehabilitation application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  battery_plus: ^7.0.0
  camera: ^0.12.0+1
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0
  dio: ^5.9.2
  drift: ^2.31.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  image: ^4.8.0
  image_picker: ^1.0.7
  intl: ^0.20.2
  json_annotation: ^4.11.0
  jwt_decoder: ^2.0.1
  path: ^1.9.0
  path_provider: ^2.1.3
  pdf: ^3.11.1
  riverpod_annotation: ^4.0.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ^0.11.0
  uuid: ^4.5.3
  video_player: ^2.11.1
  wakelock_plus: ^1.5.1
  google_mlkit_pose_detection: ^0.14.1
  tflite_flutter: ^0.12.1
  video_thumbnail: ^0.5.3
  fl_chart: ^1.2.0


dev_dependencies:
  build_runner: ^2.13.1
  drift_dev: ^2.28.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.4
  mocktail: ^1.0.5
  patrol: ^4.5.0
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.2.0

flutter_launcher_icons:
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/exercise_classifier.tflite
